name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did and what you expected }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: App version and how you installed it, placeholder: "1.0.0, Flatpak" }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: OS and phone model }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "Run with RUST_LOG=debug from a terminal", render: shell }
