[package]
name = "guitrator-apk"
version = "1.0.0"
license = "MIT"
description = "Extract APKs from an Android phone over USB, or download them from F-Droid"
repository = "https://github.com/Gu1L3RM3/guitrator-apk"
edition = "2021"

[[bin]]
name = "guitrator-apk"
path = "src/main.rs"

[lib]
name = "guitrator_apk"
path = "src/lib.rs"

[dependencies]
eframe = "0.27"
rfd = "0.14"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "0.6"
image = { version = "0.24", default-features = false, features = ["png", "webp"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
dirs-next = "2.0"
anyhow = "1.0"

[dev-dependencies]
